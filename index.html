<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Luta</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
    <header>
        <h1>Jogo de Luta</h1>

    
        <section id="characterSelect">
            <h2>Escolha seu personagem</h2>
            <div class="character-grid">
                <button class="char-option" data-class="knight">
                    <img src="assets/img/knight.gif" alt="Cavaleiro">
                    <span>Cavaleiro</span>
                </button>

                <button class="char-option" data-class="sorcerer">
                    <img src="assets/img/sorcerer.gif" alt="Mago">
                    <span>Mago</span>
                </button>

                <button class="char-option" data-class="archer">
                    <img src="assets/img/archer.gif" alt="Arqueiro">
                    <span>Arqueiro</span>
                </button>
            </div>

            <button id="startButton">Iniciar Luta</button>
        </section>
    </header>

    <main>
        <div id="char" class="fighter">
            <h2 class="name">Jogador</h2>
            <div class="lifeBar"><div class="bar"></div></div>
            <button class="attackButton">Atacar</button>
        </div>

        <div id="monster" class="fighter">
            <h2 class="name">Monstro</h2>
            <div class="lifeBar"><div class="bar"></div></div>
        </div>
    </main>

    <section id="logSection">
        <h2>Log da Batalha</h2>
        <ul id="log"></ul>
    </section>

    <script src="assets/js/classes.js"></script>
    <script src="assets/js/script.js"></script>
</body>
</html>
