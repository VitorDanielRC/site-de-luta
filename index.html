<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="assets/styles.css" />

    <title>Projeto Luta</title>
</head>
<body>
    <header class="app-header">
        <h1>Projeto Luta</h1>
        <div class="controls">
            <button id="startBattle" class="btn primary">Iniciar Luta</button>
            <button id="newMonster" class="btn">Novo inimigo</button>
            <div class="spawn-mode">Modo: Progressivo (fraco → forte)</div>
            <div class="kill-counter">Kills: <span id="killCount">0</span></div>
        </div>
    </header>

    <main>
        <div class="fightarea">

            <div id="char" class="card"> 
                <div class="avatar">🧙</div>
                <strong class="name"> -- </strong>
                <div class="lifebar">
                    <div class="bar" style="width: 10%;"> </div>
                </div>
                <div class="actions">
                    <button class="attackButton btn primary"> Atacar </button>
                </div>
            </div>

            <div id="monster" class="card"> 
                <div class="avatar">👾</div>
                <strong class="name"> -- </strong>
                <div class="lifebar">
                    <div class="bar" style="width: 10%;"> </div>
                </div>
                <div class="actions">
                    <button class="attackButton btn"> Atacar </button>
                </div>
            </div>
        </div>
    </main>


    <ul class="log"> </ul>

    <div id="rewardPanel" class="reward-panel hidden">
        <div class="reward-box">
            <h3>Escolha sua recompensa</h3>
            <p>Você pode aumentar uma das suas habilidades:</p>
            <div class="reward-actions">
                <button data-reward="attack" class="btn primary">+2 Ataque</button>
                <button data-reward="life" class="btn">+20 Vida</button>
                <button data-reward="defense" class="btn">+1 Defesa</button>
            </div>
        </div>
    </div>

    <script src="assets/js/classes.js"></script>
    <script src="assets/js/script.js"></script>
</body>
</html>
